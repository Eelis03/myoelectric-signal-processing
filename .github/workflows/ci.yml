name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only ever reads the repository. Narrowing the token here means a
# compromised dependency of any step cannot write to the repository, open a pull
# request, or publish a package under this identity.
permissions:
  contents: read

# A second push to the same branch makes the run already in flight irrelevant,
# so it is cancelled rather than left to finish against a superseded commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The package declares requires-python >=3.12, so every version that
        # declaration admits is tested rather than assumed.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --all-extras --dev

      # The coverage floor is two points below the figure measured locally, so that
      # ordinary movement does not break the build while a real regression does. The
      # integration tier runs the example scripts as subprocesses, which contribute no
      # coverage, so this figure is what the unit and property tiers reach on their own.
      #
      # The tracked figures under docs/figures are checked for existence and total size
      # by the test suite and are deliberately not compared byte for byte: matplotlib
      # output is not byte reproducible across platforms or across its own releases, so
      # such a comparison would fail on a runner where nothing had changed.
      - name: Run tests
        run: >
          uv run --python ${{ matrix.python-version }} pytest -q
          --cov=src/myoelectric --cov-report=term-missing --cov-fail-under=92

      - name: Lint
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Check formatting
        run: uv run --python ${{ matrix.python-version }} ruff format --check .

      - name: Type check
        run: uv run --python ${{ matrix.python-version }} mypy
